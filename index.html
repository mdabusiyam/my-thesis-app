<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MLOps Multi-Task AI App (Powered by Groq)</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 650px; margin: 40px auto; padding: 20px; line-height: 1.5; }
    label { font-weight: bold; display: block; margin-top: 15px; }
    select, input, textarea { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; }
    textarea { height: 120px; }
    button { margin-top: 15px; padding: 12px 20px; background-color: #0066cc; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
    button:hover { background-color: #004c99; }
    #result { margin-top: 20px; padding: 15px; background-color: #f4f6f9; border-left: 4px solid #0066cc; border-radius: 4px; min-height: 50px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>MLOps Multi-Task AI Web App</h2>
  <p>Select an AI model task, enter your Groq API key, and submit your prompt.</p>

  <label for="apiKey">Groq API Key:</label>
  <input type="password" id="apiKey" placeholder="gsk_..." />

  <label for="aiTask">Select AI Model Task:</label>
  <select id="aiTask">
    <option value="general">General AI Assistant / Q&A</option>
    <option value="summarizer">Text Summarizer</option>
    <option value="sentiment">Sentiment Analyzer</option>
    <option value="translator">English to Spanish Translator</option>
  </select>

  <label for="inputText">Input Text / Prompt:</label>
  <textarea id="inputText" placeholder="Enter your query or text here..."></textarea>

  <button onclick="runAiTask()">Run Model Inference</button>

  <div id="result">Model response will appear here...</div>

  <script>
    async function runAiTask() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const task = document.getElementById('aiTask').value;
      const text = document.getElementById('inputText').value.trim();
      const resultDiv = document.getElementById('result');

      if (!apiKey) {
        resultDiv.innerText = "Error: Please enter your Groq API key (starts with gsk_).";
        return;
      }
      if (!text) {
        resultDiv.innerText = "Error: Please enter input text.";
        return;
      }

      // Configure system prompt based on selected task
      let systemPrompt = "You are a helpful AI assistant.";
      if (task === "summarizer") {
        systemPrompt = "You are an expert summarizer. Summarize the user text in 2-3 bullet points.";
      } else if (task === "sentiment") {
        systemPrompt = "You are a sentiment analysis model. Output ONLY: Positive, Negative, or Neutral, followed by 1 short sentence explanation.";
      } else if (task === "translator") {
        systemPrompt = "You are a translator. Translate the text accurately into Spanish.";
      }

      resultDiv.innerText = "Processing request with Groq Llama 3.1...";

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${apiKey}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama-3.1-8b-instant",
            messages: [
              { role: "system", content: systemPrompt },
              { role: "user", content: text }
            ],
            temperature: 0.2
          })
        });

        const data = await response.json();

        // Safely check for API errors or empty response
        if (!response.ok || data.error) {
          resultDiv.innerText = "API Error: " + (data.error?.message || response.statusText);
        } else if (data.choices && data.choices.length > 0) {
          resultDiv.innerText = data.choices[0].message.content;
        } else {
          resultDiv.innerText = "Error: Unexpected API response format.";
        }
      } catch (err) {
        resultDiv.innerText = "Network Error: " + err.message;
      }
    }
  </script>
</body>
</html>
