<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLOps Multi-Task AI App (Powered by Groq)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.5;
      background-color: #ffffff;
      color: #333333;
    }
    h2 {
      color: #1b365d;
      margin-bottom: 5px;
    }
    p.subtitle {
      color: #666666;
      font-size: 0.95rem;
      margin-top: 0;
      margin-bottom: 20px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
      color: #1b365d;
    }
    select, input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    textarea {
      height: 120px;
      resize: vertical;
    }
    button {
      margin-top: 15px;
      padding: 12px 20px;
      background-color: #0066cc;
      color: white;
      border: none;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      border-radius: 4px;
      transition: background-color 0.2s ease;
    }
    button:hover {
      background-color: #004c99;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      background-color: #f4f6f9;
      border-left: 4px solid #0066cc;
      border-radius: 4px;
      min-height: 50px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
  </style>
</head>
<body>

  <h2>MLOps Multi-Task AI Web App</h2>
  <p class="subtitle">Select an AI task, enter your Groq API key once (saved in browser memory), and submit your prompt.</p>

  <label for="apiKey">Groq API Key:</label>
  <input type="password" id="apiKey" placeholder="gsk_..." />

  <label for="aiModel">Select Active Groq Model:</label>
  <select id="aiModel">
    <option value="openai/gpt-oss-20b">openai/gpt-oss-20b (Fastest Active Chat)</option>
    <option value="openai/gpt-oss-120b">openai/gpt-oss-120b (High Capacity Chat)</option>
    <option value="qwen/qwen3.8-27b">qwen/qwen3.8-27b (Active Multilingual)</option>
  </select>

  <label for="aiTask">Select AI Model Task:</label>
  <select id="aiTask">
    <option value="general">General AI Assistant / Q&A</option>
    <option value="summarizer">Text Summarizer</option>
    <option value="sentiment">Sentiment Analyzer</option>
    <option value="translator">English to Spanish Translator</option>
  </select>

  <label for="inputText">Input Text / Prompt:</label>
  <textarea id="inputText" placeholder="Enter your query or text here..."></textarea>

  <button onclick="runAiTask()">Run Model Inference</button>

  <div id="result">Model response will appear here...</div>

  <script>
    // Auto-fill saved Groq API key when page loads
    window.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('groq_api_key');
      if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
      }
    });

    async function runAiTask() {
      const apiKeyInput = document.getElementById('apiKey').value.trim();
      const selectedModel = document.getElementById('aiModel').value;
      const task = document.getElementById('aiTask').value;
      const text = document.getElementById('inputText').value.trim();
      const resultDiv = document.getElementById('result');

      if (!apiKeyInput) {
        resultDiv.innerText = "Error: Please enter your Groq API key (starts with gsk_).";
        return;
      }

      // Save key in browser local storage so user doesn't have to re-enter on refresh
      localStorage.setItem('groq_api_key', apiKeyInput);

      if (!text) {
        resultDiv.innerText = "Error: Please enter input text or prompt.";
        return;
      }

      // Configure system prompt based on selected task
      let systemPrompt = "You are a helpful AI assistant.";
      if (task === "summarizer") {
        systemPrompt = "You are an expert summarizer. Summarize the user text in 2-3 concise bullet points.";
      } else if (task === "sentiment") {
        systemPrompt = "You are a sentiment analysis model. Output ONLY: Positive, Negative, or Neutral, followed by 1 short sentence explanation.";
      } else if (task === "translator") {
        systemPrompt = "You are a translator. Translate the input text accurately into Spanish.";
      }

      resultDiv.innerText = "Processing request with Groq " + selectedModel + "...";

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${apiKeyInput}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: selectedModel,
            messages: [
              { role: "system", content: systemPrompt },
              { role: "user", content: text }
            ],
            temperature: 0.2
          })
        });

        const data = await response.json();

        // Safely check for API response or error status
        if (!response.ok || data.error) {
          resultDiv.innerText = "API Error: " + (data.error?.message || response.statusText);
        } else if (data.choices && data.choices.length > 0) {
          resultDiv.innerText = data.choices[0].message.content;
        } else {
          resultDiv.innerText = "Error: Unexpected API response format.";
        }
      } catch (err) {
        resultDiv.innerText = "Network Error: " + err.message;
      }
    }
  </script>

</body>
</html>
