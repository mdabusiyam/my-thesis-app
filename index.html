<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MLOps Groq Sentiment Analyzer</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
    textarea { width: 100%; height: 100px; margin-bottom: 10px; }
    button { padding: 10px 20px; background-color: #0066cc; color: white; border: none; cursor: pointer; }
    #result { margin-top: 20px; padding: 15px; background-color: #f4f4f4; border-left: 4px solid #0066cc; }
  </style>
</head>
<body>
  <h2>MLOps AI Sentiment Analyzer (Powered by Groq)</h2>
  <textarea id="inputText" placeholder="Enter text to analyze..."></textarea><br>
  <button onclick="analyzeText()">Analyze Sentiment</button>
  <div id="result">Result will appear here...</div>

  <script>
    async function analyzeText() {
      const text = document.getElementById('inputText').value;
      const resultDiv = document.getElementById('result');
      if (!text) { resultDiv.innerText = "Please enter some text."; return; }

      resultDiv.innerText = "Analyzing with Groq Llama 3.1...";

      // Replace with your Groq API key or proxy endpoint
      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer gsk_YOUR_GROQ_API_KEY_HERE",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama-3.1-8b-instant",
            messages: [
              { role: "system", content: "Analyze sentiment in 1 short sentence." },
              { role: "user", content: text }
            ]
          })
        });
        const data = await response.json();
        resultDiv.innerText = data.choices[0].message.content;
      } catch (err) {
        resultDiv.innerText = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
