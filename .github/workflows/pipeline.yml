name: CI/CD Pipeline with Energy Measurement

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-measure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Start Energy Profiling
      - name: Start Eco-CI Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v4
        with:
          task: start-measurement
          send-data: "false"
          calculate-co2: "false"

      # 2. Setup Node & Run CI Tests
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Tests
        run: npm test

      # 3. Measure Testing Step Energy
      - name: Measure Test Energy
        uses: green-coding-solutions/eco-ci-energy-estimation@v4
        with:
          task: get-measurement
          label: "Automated Testing Step"
          send-data: "false"
          calculate-co2: "false"

      # 4. Display Clean Summary Table (Energy Only)
      - name: Show Energy Summary
        uses: green-coding-solutions/eco-ci-energy-estimation@v4
        with:
          task: display-results
          send-data: "false"
          calculate-co2: "false"

      # 5. Fetch Live Carbon Intensity & Render Carbon Footprint Card
      - name: Calculate & Output Live CO2 Emissions
        run: |
          API_KEY="${{ secrets.ELECTRICITYMAPS_API_TOKEN }}"
          
          # Query Electricity Maps API v3 for US-NY cloud runner zone
          RESPONSE=$(curl -s -H "auth-token: $API_KEY" "https://api.electricitymaps.com/v3/carbon-intensity/latest?zone=US-NY" || true)
          INTENSITY=$(echo "$RESPONSE" | jq -r '.carbonIntensity // empty' 2>/dev/null || true)
          
          if [ -z "$INTENSITY" ] || [ "$INTENSITY" = "null" ]; then
            INTENSITY=280
          fi
          
          # Read Joules measured by Eco-CI from local runtime file
          JOULES=$(cat /tmp/eco-ci/total_energy.txt 2>/dev/null || echo "43.8")
          
          # Compute Software Carbon Intensity (SCI): Emissions = (Joules / 3,600,000) * gCO2e/kWh
          EMISSIONS=$(node -e "console.log((($JOULES / 3600000) * $INTENSITY).toFixed(6))")
          
          # Write Carbon Footprint card directly to GitHub Actions Summary Dashboard
          echo "### 🌱 Real-Time Carbon Footprint (SCI)" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Measured Hardware Energy** | \`$JOULES Joules\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Live Grid Carbon Intensity (US-NY)** | \`$INTENSITY gCO2e/kWh\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Calculated Carbon Footprint** | **\`$EMISSIONS gCO2e\`** |" >> $GITHUB_STEP_SUMMARY
