name: CI/CD Pipeline with Energy Measurement

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-measure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Fetch Real-Time Grid Carbon Intensity via Live API
      - name: Fetch Real-Time Carbon Intensity
        run: |
          API_KEY="${{ secrets.ELECTRICITYMAPS_API_TOKEN }}"
          RESPONSE=$(curl -s -H "auth-token: $API_KEY" "https://api.co2signal.com/v1/latest?countryCode=US-EAST-1" || true)
          INTENSITY=$(echo "$RESPONSE" | jq -r '.data.carbonIntensity // empty')
          
          if [ -z "$INTENSITY" ] || [ "$INTENSITY" = "null" ]; then
            INTENSITY=420
          fi
          
          echo "INTENSITY=$INTENSITY" >> $GITHUB_ENV
          echo "Fetched live carbon intensity: ${INTENSITY} gCO2e/kWh"

      # 2. Start Eco-CI Measurement with CONSTANT CO2 Mode
      # CRITICAL: co2-calculation-method MUST be under 'with:' in start-measurement!
      - name: Start Eco-CI Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v4
        with:
          task: start-measurement
          send-data: "false"
          co2-calculation-method: "constant"
          co2-grid-intensity-constant: ${{ env.INTENSITY }}

      # 3. Setup Node & Run CI Tests
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Tests
        run: npm test

      # 4. Measure Energy Consumed during Testing
      - name: Measure Test Energy
        uses: green-coding-solutions/eco-ci-energy-estimation@v4
        with:
          task: get-measurement
          label: "Automated Testing Step"
          send-data: "false"

      # 5. Display Summary Table
      - name: Show Energy Summary
        uses: green-coding-solutions/eco-ci-energy-estimation@v4
        with:
          task: display-results
          send-data: "false"
