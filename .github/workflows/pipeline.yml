name: CI/CD Pipeline with Energy Measurement

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-measure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Fetch Real-Time Carbon Intensity from Electricity Maps API
      - name: Fetch Real-Time Carbon Intensity
        run: |
          API_KEY="${{ secrets.ELECTRICITYMAPS_API_TOKEN }}"
          RESPONSE=$(curl -s -H "auth-token: $API_KEY" "https://api.electricitymaps.com/v3/carbon-intensity/latest?zone=US-EAST-1" || true)
          INTENSITY=$(echo "$RESPONSE" | jq -r '.carbonIntensity // empty')

          if [ -z "$INTENSITY" ] || [ "$INTENSITY" = "null" ]; then
            RESPONSE=$(curl -s -H "auth-token: $API_KEY" "https://api.co2signal.com/v1/latest?countryCode=US-EAST-1" || true)
            INTENSITY=$(echo "$RESPONSE" | jq -r '.data.carbonIntensity // empty')
          fi

          if [ -z "$INTENSITY" ] || [ "$INTENSITY" = "null" ]; then
            INTENSITY=420
          fi

          echo "LIVE_CARBON_INTENSITY=$INTENSITY" >> $GITHUB_ENV
          echo "Fetched Live Grid Carbon Intensity: ${INTENSITY} gCO2e/kWh"

      # 2. Start Measurement with Environment Variables
      - name: Start Eco-CI Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v4
        env:
          CO2_CALCULATION_METHOD: "constant"
          CO2_GRID_INTENSITY_CONSTANT: ${{ env.LIVE_CARBON_INTENSITY }}
          ECO_CI_SEND_DATA: "false"
        with:
          task: start-measurement

      # 3. Setup Node & Run CI Tests
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Tests (CI Stage)
        run: npm test

      # 4. Measure Testing Step Energy
      - name: Measure Test Energy
        uses: green-coding-solutions/eco-ci-energy-estimation@v4
        env:
          ECO_CI_SEND_DATA: "false"
        with:
          task: get-measurement
          label: "Automated Testing Step"

      # 5. Show Summary Table
      - name: Show Energy Summary
        uses: green-coding-solutions/eco-ci-energy-estimation@v4
        env:
          ECO_CI_SEND_DATA: "false"
        with:
          task: display-results
