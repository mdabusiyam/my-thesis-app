name: CI/CD Pipeline with Energy Measurement

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-measure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Start Energy Profiling (CO2 IP lookup disabled to prevent ipapi.co errors)
      - name: Start Eco-CI Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v4
        with:
          task: start-measurement
          send-data: "false"
          calculate-co2: "false"

      # 2. Setup Node & Run CI Tests
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Tests
        run: npm test

      # 3. Measure Testing Step Energy
      - name: Measure Test Energy
        uses: green-coding-solutions/eco-ci-energy-estimation@v4
        with:
          task: get-measurement
          label: "Automated Testing Step"
          send-data: "false"
          calculate-co2: "false"

      # 4. Display Clean Summary Table (Energy Only)
      - name: Show Energy Summary
        uses: green-coding-solutions/eco-ci-energy-estimation@v4
        with:
          task: display-results
          send-data: "false"
          calculate-co2: "false"

      # 5. Fetch Real-Time Grid Carbon Intensity via Electricity Maps API
      - name: Real-Time Grid Carbon Calculation (Live API)
        run: |
          API_KEY="${{ secrets.ELECTRICITYMAPS_API_TOKEN }}"
          
          # Query Electricity Maps API v3 (Zone: BD for Bangladesh, or US-NY for US East cloud runner)
          RESPONSE=$(curl -s -w "\n%{http_code}" -H "auth-token: $API_KEY" "https://api.electricitymaps.com/v3/carbon-intensity/latest?zone=BD" || true)
          
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "HTTP Status Code: $HTTP_STATUS"
          echo "Raw API Response: $BODY"
          
          INTENSITY=$(echo "$BODY" | jq -r '.carbonIntensity // empty' 2>/dev/null || true)
          
          if [ -z "$INTENSITY" ] || [ "$INTENSITY" = "null" ]; then
            echo "API Key check or zone lookup defaulted. Using regional fallback baseline."
            INTENSITY=420
          fi
          
          echo "=========================================================="
          echo "LIVE GRID CARBON INTENSITY : ${INTENSITY} gCO2e/kWh"
          echo "FORMULA                    : Carbon (gCO2e) = Energy (Joules) * Intensity / 3.6e6"
          echo "=========================================================="
