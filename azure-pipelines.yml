trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '18.x'
    displayName: 'Install Node.js'

  - script: |
      npm ci
    displayName: 'Install Dependencies'

  - script: |
      npm test
    displayName: 'Run Automated Tests (CI)'

  - script: |
      echo "Build and tests successfully verified via Azure Pipelines!"
      echo "Ready for deployment."
    displayName: 'Deployment Step (CD)'
